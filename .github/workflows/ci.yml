name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Kept in sync with the lockfile (lockfileVersion 9.0) and local
          # development. package.json has no `packageManager` field, so the
          # version has to be stated here.
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `tsc -b && vite build`
      - name: Type-check and build
        run: pnpm build

      - name: Build Storybook docs
        run: pnpm build-storybook

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook-static
          retention-days: 7
          if-no-files-found: error
