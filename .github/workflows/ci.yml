name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          # Kept in sync with the lockfile (lockfileVersion 9.0) and local
          # development. package.json has no `packageManager` field, so the
          # version has to be stated here.
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm test` is the node-environment project: fast, no browser, and the
      # gate that has to pass.
      # `pnpm test` 是 node 环境那个 project：快、不需要浏览器，也是必须通过的那道门。
      - name: Test
        run: pnpm test

      # The story suite (42 stories across the three Wrappers, all mounted inside
      # StrictMode) runs here but does not fail the build: one unhandled
      # `Object is disposed` from inside lightweight-charts' deferred draw makes
      # vitest exit non-zero whatever the tests do. See #8 — until that is
      # resolved upstream, a blocking step here would only teach people to ignore
      # a red CI that is not reporting a real regression.
      # story 套件（三个 Wrapper 共 42 条，全部在 StrictMode 下挂载）在这里跑，但不拦构建：
      # lightweight-charts 自己延迟重绘里那条未处理的 `Object is disposed` 会让 vitest
      # 无论测试结果如何都以非零退出。见 #8 —— 上游修掉之前，把它设成阻塞步骤只会让人
      # 习惯忽略一个并没有报告真实回归的红。
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: "Test stories (non-blocking until #8)"
        continue-on-error: true
        run: pnpm test:storybook

      # `tsc -b && vite build`
      - name: Type-check and build
        run: pnpm build

      - name: Build Storybook docs
        run: pnpm build-storybook

      - name: Upload docs
        uses: actions/upload-artifact@v7
        with:
          name: storybook
          path: storybook-static
          retention-days: 7
          if-no-files-found: error
